    <circle cx="480" cy="40" r="210" fill="url(#glowCyan)">
      <animate attributeName="cx" values="480;340;510;480" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="40;110;30;40" dur="9s" repeatCount="indefinite" />
      <animate attributeName="r" values="210;250;195;210" dur="7s" repeatCount="indefinite" />
    </circle>
