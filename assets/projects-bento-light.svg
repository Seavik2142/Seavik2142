<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>

    <!-- Subtle Micro-Grid Pattern -->
    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#09090B" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Card Clip Paths -->
    <clipPath id="clipCard1"><rect x="1" y="1" width="590" height="200" rx="16" /></clipPath>
    <clipPath id="clipCard2"><rect x="609" y="1" width="590" height="200" rx="16" /></clipPath>
    <clipPath id="clipCard3"><rect x="1" y="219" width="590" height="200" rx="16" /></clipPath>
    <clipPath id="clipCard4"><rect x="609" y="219" width="590" height="200" rx="16" /></clipPath>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.15" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.15" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#2DD4BF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <!-- Border Shimmer Gradients -->
    <linearGradient id="beamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0" />
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Bar Shimmer Overlay -->
    <linearGradient id="barShimmer" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="1200 0" dur="4.5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- ======================================================================= -->
  <!-- CARD 1: ChhlatAI (Top-Left: x=1, y=1, w=590, h=200)                     -->
  <!-- ======================================================================= -->
  <g clip-path="url(#clipCard1)">
    <rect x="1" y="1" width="590" height="200" rx="16" fill="#FFFFFF" />
    <rect x="1" y="1" width="590" height="200" fill="url(#cardGrid)" />
