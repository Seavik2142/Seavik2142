<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#111115" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Main Card Surface -->
  <rect x="1" y="1" width="1198" height="308" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="308" rx="18" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="308" rx="18" fill="url(#topGlow)" />

  <!-- Status Pill -->
  <rect x="52" y="38" width="336" height="28" rx="14" fill="#064E3B" fill-opacity="0.35" stroke="#10B981" stroke-opacity="0.35" stroke-width="1" />
  <circle cx="70" cy="52" r="4" fill="#34D399" />
  <text x="84" y="56" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.2">
    Available for AI &amp; Backend Engineering Roles
  </text>

  <!-- Name & Primary Title -->
  <text x="52" y="114" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">
    Mao Seavik
  </text>
  <text x="304" y="112" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="500">
    @Seavik2142
  </text>

  <text x="52" y="148" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="-0.2">
    AI Engineer &amp; Backend Software Developer
  </text>

  <text x="52" y="180" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
    Fine-tuning open-source language models (Qwen2.5, PEFT/LoRA, GGUF), building Python APIs (FastAPI, Flask), and shipping full-stack systems.
  </text>

  <!-- Right Side Location / University Badge -->
  <rect x="910" y="38" width="238" height="54" rx="12" fill="#18181B" fill-opacity="0.9" stroke="#27272A" stroke-width="1" />
  <text x="930" y="61" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    Phnom Penh, Cambodia
  </text>
  <text x="930" y="79" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">
    Norton University &middot; Computer Studies
  </text>

  <!-- Divider Line -->
  <line x1="52" y1="210" x2="1148" y2="210" stroke="#27272A" stroke-width="1" />

  <!-- Bottom 4 Bento Stat Blocks -->
  <!-- Stat 1 -->
  <text x="52" y="240" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    SPECIALIZATION
  </text>
  <text x="52" y="266" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    LLM Fine-Tuning &amp; AI Agents
  </text>

  <!-- Stat 2 -->
  <line x1="340" y1="224" x2="340" y2="280" stroke="#27272A" stroke-width="1" />
  <text x="368" y="240" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    HUGGING FACE HUB
  </text>
  <text x="368" y="266" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    4 Published Models (@Maoseavik)
  </text>

  <!-- Stat 3 -->
  <line x1="650" y1="224" x2="650" y2="280" stroke="#27272A" stroke-width="1" />
  <text x="678" y="240" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    CORE STACK
  </text>
  <text x="678" y="266" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    Python &middot; TypeScript &middot; FastAPI &middot; React
  </text>

  <!-- Stat 4 -->
  <line x1="965" y1="224" x2="965" y2="280" stroke="#27272A" stroke-width="1" />
  <text x="993" y="240" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    REPOSITORIES
  </text>
  <text x="993" y="266" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    23 Public Projects
  </text>
</svg>
