    <text x="14" y="1" text-anchor="middle" class="sans" font-size="11.5" font-weight="800" fill="#B45309">HF</text>
    <text x="38" y="1" class="sans" font-size="17" font-weight="800" fill="#0F172A" letter-spacing="-0.3">Published Language Models · Hugging Face (@Maoseavik)</text>
    <circle cx="516" cy="-4" r="3" fill="#F59E0B">
