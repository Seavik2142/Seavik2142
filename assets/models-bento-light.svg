    <text x="435" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#4338CA">Transformers</text>

    <text x="0" y="52" class="sans" font-size="19.5" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Maoseavik / agrisystem-qwen2.5-3b-adapter</text>
    <text x="0" y="76" class="sans" font-size="13" font-weight="400" fill="#475569">Parameter-efficient adapter weights trained on curated agricultural</text>
    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#475569">knowledge bases for structured symptom-to-treatment domain reasoning.</text>

    <g transform="translate(0, 116)">
