<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    </style>

    <linearGradient id="bgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <radialGradient id="amberOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.11"/>
      <stop offset="65%" stop-color="#FEF3C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="skyOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.10"/>
      <stop offset="65%" stop-color="#E0F2FE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beamAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <clipPath id="clipM1"><rect x="4" y="54" width="542" height="278" rx="18"/></clipPath>
    <clipPath id="clipM2"><rect x="574" y="54" width="542" height="278" rx="18"/></clipPath>
  </defs>

  <!-- Section Header -->
  <g transform="translate(8, 28)">
    <rect x="0" y="-15" width="28" height="22" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="14" y="1" text-anchor="middle" class="sans" font-size="11.5" font-weight="800" fill="#B45309">HF</text>
    <text x="38" y="1" class="sans" font-size="17" font-weight="800" fill="#0F172A" letter-spacing="-0.3">Open-Weight AI Models · Hugging Face</text>
    <circle cx="366" cy="-4" r="3" fill="#F59E0B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1104" y="0" text-anchor="end" class="sans" font-size="12.5" font-weight="600" fill="#64748B">huggingface.co/Seavik · Fine-tuned &amp; Quantized</text>
  </g>

  <!-- ==================== MODEL 1: GPT-OSS-20B ==================== -->
  <rect x="4" y="54" width="542" height="278" rx="18" fill="url(#bgCard)" stroke="#E2E8F0" stroke-width="1.5"/>
  <g clip-path="url(#clipM1)">
    <circle cx="480" cy="95" r="200" fill="url(#amberOrb)">
      <animate attributeName="cx" values="480;390;480" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;165;95" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="4" y="54" width="542" height="278" rx="18" fill="none" stroke="url(#beamAmber)" stroke-width="1.8" stroke-dasharray="220 1450" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="1670" to="0" dur="11s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(30, 82)">
    <rect x="0" y="0" width="114" height="24" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="13" cy="12" r="3.5" fill="#D97706">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" class="sans" font-size="11" font-weight="700" fill="#B45309">Text Generation</text>

    <rect x="122" y="0" width="96" height="24" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="170" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#334155">20B Params</text>

    <rect x="378" y="0" width="112" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="434" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#047857">Safetensors · 16-bit</text>

    <text x="0" y="54" class="sans" font-size="21" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Seavik / gpt-oss-20b-khmer</text>
    <text x="0" y="80" class="sans" font-size="13.5" font-weight="400" fill="#475569">20B-parameter open-weight LLM fine-tuned for bilingual Khmer &amp; English</text>
    <text x="0" y="100" class="sans" font-size="13.5" font-weight="400" fill="#475569">reasoning, structured instruction following, and cultural context preservation.</text>

    <!-- Spec Grid -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="236" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="17" class="sans" font-size="10.5" font-weight="600" fill="#64748B">BASE ARCHITECTURE</text>
      <text x="14" y="34" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Open-Weight Transformer (20B)</text>

      <rect x="250" y="0" width="240" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="264" y="17" class="sans" font-size="10.5" font-weight="600" fill="#64748B">TRAINING PIPELINE</text>
      <text x="264" y="34" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Unsloth QLoRA · Bilingual SFT</text>
    </g>

    <!-- Tags -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="84" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="42" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">Khmer NLP</text>

      <rect x="92" y="0" width="76" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="130" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">Unsloth</text>

      <rect x="176" y="0" width="88" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="220" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">Transformers</text>

      <rect x="272" y="0" width="76" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="310" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">Bilingual</text>
    </g>
  </g>

  <!-- ==================== MODEL 2: GEMMA3-4B ==================== -->
  <rect x="574" y="54" width="542" height="278" rx="18" fill="url(#bgCard)" stroke="#E2E8F0" stroke-width="1.5"/>
  <g clip-path="url(#clipM2)">
    <circle cx="1040" cy="95" r="200" fill="url(#skyOrb)">
      <animate attributeName="cx" values="1040;950;1040" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;165;95" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="574" y="54" width="542" height="278" rx="18" fill="none" stroke="url(#beamAmber)" stroke-width="1.8" stroke-dasharray="220 1450" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="835" to="-835" dur="11s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(600, 82)">
    <rect x="0" y="0" width="128" height="24" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
    <circle cx="13" cy="12" r="3.5" fill="#0284C7">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" class="sans" font-size="11" font-weight="700" fill="#0369A1">Instruction Tuned</text>

    <rect x="136" y="0" width="90" height="24" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="181" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#334155">4B Params</text>

    <rect x="372" y="0" width="118" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="431" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#047857">GGUF · Q4_K_M</text>

    <text x="0" y="54" class="sans" font-size="21" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Seavik / gemma3-4b-khmer-instruct</text>
    <text x="0" y="80" class="sans" font-size="13.5" font-weight="400" fill="#475569">Compact, low-latency Gemma 3 4B model optimized for edge deployment,</text>
    <text x="0" y="100" class="sans" font-size="13.5" font-weight="400" fill="#475569">local RAG pipelines, and real-time Khmer conversational assistants.</text>

    <!-- Spec Grid -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="236" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="17" class="sans" font-size="10.5" font-weight="600" fill="#64748B">BASE ARCHITECTURE</text>
      <text x="14" y="34" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Google Gemma 3 (4B Instruct)</text>

      <rect x="250" y="0" width="240" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="264" y="17" class="sans" font-size="10.5" font-weight="600" fill="#64748B">RUNTIME TARGETS</text>
      <text x="264" y="34" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">llama.cpp · Ollama · vLLM Edge</text>
    </g>

    <!-- Tags -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="76" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">Gemma 3</text>

      <rect x="84" y="0" width="66" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="117" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">GGUF</text>

      <rect x="158" y="0" width="84" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="200" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">llama.cpp</text>

      <rect x="250" y="0" width="76" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="288" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#334155">Edge AI</text>
    </g>
  </g>
</svg>