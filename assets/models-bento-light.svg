      <rect x="164" y="0" width="68" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="198" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">Ollama</text>

      <rect x="240" y="0" width="102" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="291" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">Edge Inference</text>

      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="700" fill="#0284C7">HF Model →</text>
    </g>
  </g>

