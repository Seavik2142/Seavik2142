    <text x="24" y="16" class="sans" font-size="11" font-weight="700" fill="#4338CA">PEFT · LoRA (1.5B)</text>

    <rect x="140" y="0" width="152" height="24" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="216" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#334155">Qwen2.5-1.5B-Instruct</text>

    <rect x="386" y="0" width="104" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="438" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#047857">SafeTensors</text>

    <text x="0" y="52" class="sans" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Maoseavik / agri-expert-adapter</text>
    <text x="0" y="76" class="sans" font-size="13" font-weight="400" fill="#475569">Compact 1.5B parameter LoRA adapter built for fast conversational</text>
    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#475569">response times and lightweight inference on memory-constrained hardware.</text>

    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="60" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="30" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">PEFT</text>

      <rect x="68" y="0" width="60" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="98" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">LoRA</text>

      <rect x="136" y="0" width="96" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="184" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">Qwen2.5-1.5B</text>

      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="700" fill="#4F46E5">HF Model →</text>
