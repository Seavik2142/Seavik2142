      <text x="44" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">Qwen2.5-3B</text>

      <rect x="96" y="0" width="54" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="123" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">SFT</text>

      <rect x="158" y="0" width="54" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="185" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">TRL</text>

      <rect x="220" y="0" width="88" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="264" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">PEFT / LoRA</text>

      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="700" fill="#B45309">HF Model →</text>
    </g>
  </g>

  <!-- ==================== MODEL 2: agrisystem-qwen2.5-3b-gguf ==================== -->
  <rect x="574" y="54" width="542" height="232" rx="18" fill="url(#bgCard)" stroke="#E2E8F0" stroke-width="1.5"/>
  <g clip-path="url(#m2)">
