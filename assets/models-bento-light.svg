      <rect x="102" y="0" width="76" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="140" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">Adapter</text>

      <rect x="186" y="0" width="88" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="230" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#1E293B">Qwen2.5-3B</text>

      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="700" fill="#059669">HF Model →</text>
    </g>
  </g>

  <!-- ==================== MODEL 4: agri-expert-adapter ==================== -->
