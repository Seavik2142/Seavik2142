      <animate attributeName="cx" values="1040;950;1040" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;155;95" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="574" y="54" width="542" height="232" rx="18" fill="none" stroke="url(#beamAmber)" stroke-width="1.8" stroke-dasharray="220 1350" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="1180" to="-390" dur="11s" repeatCount="indefinite"/>
