    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#475569">low-latency local and CPU inference using llama.cpp or Ollama.</text>

    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="64" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
