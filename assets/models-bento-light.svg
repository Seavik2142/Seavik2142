    <text x="200" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#334155">Qwen2.5-3B-Instruct</text>

    <rect x="386" y="0" width="104" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="438" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#047857">SafeTensors</text>

    <text x="0" y="52" class="sans" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Maoseavik / agri-qwen3b-lora</text>
    <text x="0" y="76" class="sans" font-size="13" font-weight="400" fill="#475569">Supervised fine-tuned LoRA adapter on Qwen2.5-3B-Instruct trained for</text>
    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#475569">crop disease diagnosis, treatment planning, and agricultural Q&amp;A.</text>

