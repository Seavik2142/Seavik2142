      <text x="47" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Transformers</text>

      <rect x="102" y="0" width="76" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="140" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Adapter</text>

      <rect x="186" y="0" width="88" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="230" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Qwen2.5-3B</text>

      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="600" fill="#34D399">HF Model →</text>
    </g>
  </g>

  <!-- ==================== MODEL 4: agri-expert-adapter ==================== -->
