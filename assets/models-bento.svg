    <text x="0" y="76" class="sans" font-size="13" font-weight="400" fill="#A1A1AA">Supervised fine-tuned LoRA adapter on Qwen2.5-3B-Instruct trained for</text>
    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#A1A1AA">crop disease diagnosis, treatment planning, and agricultural Q&amp;A.</text>

