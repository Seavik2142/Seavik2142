<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    </style>

    <linearGradient id="bgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13131A"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>

    <radialGradient id="amberOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="skyOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beamAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <clipPath id="clipM1"><rect x="4" y="54" width="542" height="278" rx="18"/></clipPath>
    <clipPath id="clipM2"><rect x="574" y="54" width="542" height="278" rx="18"/></clipPath>
  </defs>

  <!-- Section Header -->
  <g transform="translate(8, 28)">
    <rect x="0" y="-15" width="28" height="22" rx="6" fill="#291D0A" stroke="#78350F" stroke-width="1"/>
    <text x="14" y="1" text-anchor="middle" class="sans" font-size="11.5" font-weight="800" fill="#FBBF24">HF</text>
    <text x="38" y="1" class="sans" font-size="17" font-weight="800" fill="#FAFAFA" letter-spacing="-0.3">Open-Weight AI Models · Hugging Face</text>
    <circle cx="366" cy="-4" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1104" y="0" text-anchor="end" class="sans" font-size="12.5" font-weight="600" fill="#71717A">huggingface.co/Seavik · Fine-tuned &amp; Quantized</text>
  </g>

  <!-- ==================== MODEL 1: GPT-OSS-20B ==================== -->
  <rect x="4" y="54" width="542" height="278" rx="18" fill="url(#bgCard)" stroke="#27272A" stroke-width="1.2"/>
  <g clip-path="url(#clipM1)">
    <circle cx="480" cy="95" r="200" fill="url(#amberOrb)">
      <animate attributeName="cx" values="480;390;480" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;165;95" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="4" y="54" width="542" height="278" rx="18" fill="none" stroke="url(#beamAmber)" stroke-width="1.6" stroke-dasharray="220 1450" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="1670" to="0" dur="11s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(30, 82)">
    <rect x="0" y="0" width="114" height="24" rx="12" fill="#271A07" stroke="#78350F" stroke-width="1"/>
    <circle cx="13" cy="12" r="3.5" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" class="sans" font-size="11" font-weight="700" fill="#FDE68A">Text Generation</text>

    <rect x="122" y="0" width="96" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="170" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#E4E4E7">20B Params</text>

    <rect x="378" y="0" width="112" height="24" rx="12" fill="#0B2117" stroke="#065F46" stroke-width="1"/>
    <text x="434" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#6EE7B7">Safetensors · 16-bit</text>

    <text x="0" y="54" class="sans" font-size="21" font-weight="800" fill="#FAFAFA" letter-spacing="-0.4">Seavik / gpt-oss-20b-khmer</text>
    <text x="0" y="80" class="sans" font-size="13.5" font-weight="400" fill="#A1A1AA">20B-parameter open-weight LLM fine-tuned for bilingual Khmer &amp; English</text>
    <text x="0" y="100" class="sans" font-size="13.5" font-weight="400" fill="#A1A1AA">reasoning, structured instruction following, and cultural context preservation.</text>

    <!-- Spec Grid -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="236" height="44" rx="10" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="14" y="17" class="sans" font-size="10.5" font-weight="600" fill="#71717A">BASE ARCHITECTURE</text>
      <text x="14" y="34" class="sans" font-size="12.5" font-weight="700" fill="#E4E4E7">Open-Weight Transformer (20B)</text>

      <rect x="250" y="0" width="240" height="44" rx="10" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="264" y="17" class="sans" font-size="10.5" font-weight="600" fill="#71717A">TRAINING PIPELINE</text>
      <text x="264" y="34" class="sans" font-size="12.5" font-weight="700" fill="#E4E4E7">Unsloth QLoRA · Bilingual SFT</text>
    </g>

    <!-- Tags -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="84" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="42" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Khmer NLP</text>

      <rect x="92" y="0" width="76" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="130" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Unsloth</text>

      <rect x="176" y="0" width="88" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="220" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Transformers</text>

      <rect x="272" y="0" width="76" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="310" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Bilingual</text>
    </g>
  </g>

  <!-- ==================== MODEL 2: GEMMA3-4B ==================== -->
  <rect x="574" y="54" width="542" height="278" rx="18" fill="url(#bgCard)" stroke="#27272A" stroke-width="1.2"/>
  <g clip-path="url(#clipM2)">
    <circle cx="1040" cy="95" r="200" fill="url(#skyOrb)">
      <animate attributeName="cx" values="1040;950;1040" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;165;95" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="574" y="54" width="542" height="278" rx="18" fill="none" stroke="url(#beamAmber)" stroke-width="1.6" stroke-dasharray="220 1450" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="835" to="-835" dur="11s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(600, 82)">
    <rect x="0" y="0" width="128" height="24" rx="12" fill="#0C2233" stroke="#0369A1" stroke-width="1"/>
    <circle cx="13" cy="12" r="3.5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" class="sans" font-size="11" font-weight="700" fill="#7DD3FC">Instruction Tuned</text>

    <rect x="136" y="0" width="90" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="181" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#E4E4E7">4B Params</text>

    <rect x="372" y="0" width="118" height="24" rx="12" fill="#0B2117" stroke="#065F46" stroke-width="1"/>
    <text x="431" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#6EE7B7">GGUF · Q4_K_M</text>

    <text x="0" y="54" class="sans" font-size="21" font-weight="800" fill="#FAFAFA" letter-spacing="-0.4">Seavik / gemma3-4b-khmer-instruct</text>
    <text x="0" y="80" class="sans" font-size="13.5" font-weight="400" fill="#A1A1AA">Compact, low-latency Gemma 3 4B model optimized for edge deployment,</text>
    <text x="0" y="100" class="sans" font-size="13.5" font-weight="400" fill="#A1A1AA">local RAG pipelines, and real-time Khmer conversational assistants.</text>

    <!-- Spec Grid -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="236" height="44" rx="10" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="14" y="17" class="sans" font-size="10.5" font-weight="600" fill="#71717A">BASE ARCHITECTURE</text>
      <text x="14" y="34" class="sans" font-size="12.5" font-weight="700" fill="#E4E4E7">Google Gemma 3 (4B Instruct)</text>

      <rect x="250" y="0" width="240" height="44" rx="10" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="264" y="17" class="sans" font-size="10.5" font-weight="600" fill="#71717A">RUNTIME TARGETS</text>
      <text x="264" y="34" class="sans" font-size="12.5" font-weight="700" fill="#E4E4E7">llama.cpp · Ollama · vLLM Edge</text>
    </g>

    <!-- Tags -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="76" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Gemma 3</text>

      <rect x="84" y="0" width="66" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="117" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">GGUF</text>

      <rect x="158" y="0" width="84" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="200" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">llama.cpp</text>

      <rect x="250" y="0" width="76" height="26" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="288" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Edge AI</text>
    </g>
  </g>
</svg>