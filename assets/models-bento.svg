<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" width="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    </style>

    <linearGradient id="bgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13131A"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>

    <radialGradient id="amberOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="skyOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beamAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <clipPath id="m1"><rect x="4" y="54" width="542" height="232" rx="18"/></clipPath>
    <clipPath id="m2"><rect x="574" y="54" width="542" height="232" rx="18"/></clipPath>
    <clipPath id="m3"><rect x="4" y="308" width="542" height="232" rx="18"/></clipPath>
    <clipPath id="m4"><rect x="574" y="308" width="542" height="232" rx="18"/></clipPath>
