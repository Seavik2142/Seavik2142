  <rect x="574" y="308" width="542" height="232" rx="18" fill="none" stroke="url(#beamAmber)" stroke-width="1.6" stroke-dasharray="220 1350" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="390" to="-1180" dur="11s" repeatCount="indefinite"/>
  </rect>

