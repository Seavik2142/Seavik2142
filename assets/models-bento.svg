      <text x="30" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">PEFT</text>

      <rect x="68" y="0" width="60" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="98" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">LoRA</text>

      <rect x="136" y="0" width="96" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="184" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Qwen2.5-1.5B</text>

      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="600" fill="#818CF8">HF Model →</text>
