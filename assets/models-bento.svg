  </g>

  <!-- ==================== MODEL 1: agri-qwen3b-lora ==================== -->
  <rect x="4" y="54" width="542" height="232" rx="18" fill="url(#bgCard)" stroke="#27272A" stroke-width="1.2"/>
  <g clip-path="url(#m1)">
