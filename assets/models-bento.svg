    <text x="200" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#E4E4E7">Qwen2.5-3B-Instruct</text>

    <rect x="386" y="0" width="104" height="24" rx="12" fill="#0B2117" stroke="#065F46" stroke-width="1"/>
    <text x="438" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#6EE7B7">SafeTensors</text>

