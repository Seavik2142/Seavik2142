      <rect x="164" y="0" width="68" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="198" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Ollama</text>

      <rect x="240" y="0" width="102" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="291" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">Edge Inference</text>

      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="600" fill="#38BDF8">HF Model →</text>
    </g>
  </g>

