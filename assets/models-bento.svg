      <rect x="96" y="0" width="54" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="123" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">SFT</text>

      <rect x="158" y="0" width="54" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="185" y="17" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#D4D4D8">TRL</text>

