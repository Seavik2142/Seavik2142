    <text x="435" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#A5B4FC">Transformers</text>

    <text x="0" y="52" class="sans" font-size="19.5" font-weight="800" fill="#FAFAFA" letter-spacing="-0.4">Maoseavik / agrisystem-qwen2.5-3b-adapter</text>
    <text x="0" y="76" class="sans" font-size="13" font-weight="400" fill="#A1A1AA">Parameter-efficient adapter weights trained on curated agricultural</text>
    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#A1A1AA">knowledge bases for structured symptom-to-treatment domain reasoning.</text>

    <g transform="translate(0, 116)">
