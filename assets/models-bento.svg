      <text x="490" y="17" text-anchor="end" class="sans" font-size="11.5" font-weight="600" fill="#FBBF24">HF Model →</text>
    </g>
  </g>

  <!-- ==================== MODEL 2: agrisystem-qwen2.5-3b-gguf ==================== -->
