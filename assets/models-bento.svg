    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#A1A1AA">low-latency local and CPU inference using llama.cpp or Ollama.</text>

    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="64" height="26" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
