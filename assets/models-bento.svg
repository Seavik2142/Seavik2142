    </circle>
    <text x="24" y="16" class="sans" font-size="11" font-weight="700" fill="#A5B4FC">PEFT · LoRA (1.5B)</text>

    <rect x="140" y="0" width="152" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="216" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#E4E4E7">Qwen2.5-1.5B-Instruct</text>

    <rect x="386" y="0" width="104" height="24" rx="12" fill="#0B2117" stroke="#065F46" stroke-width="1"/>
    <text x="438" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#6EE7B7">SafeTensors</text>

    <text x="0" y="52" class="sans" font-size="20" font-weight="800" fill="#FAFAFA" letter-spacing="-0.4">Maoseavik / agri-expert-adapter</text>
    <text x="0" y="76" class="sans" font-size="13" font-weight="400" fill="#A1A1AA">Compact 1.5B parameter LoRA adapter built for fast conversational</text>
    <text x="0" y="95" class="sans" font-size="13" font-weight="400" fill="#A1A1AA">response times and lightweight inference on memory-constrained hardware.</text>

    <g transform="translate(0, 116)">
