<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 295" width="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    </style>

    <linearGradient id="bgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13131A"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>

    <linearGradient id="beamStack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Section Header -->
  <g transform="translate(8, 28)">
    <rect x="0" y="-15" width="28" height="22" rx="6" fill="#191633" stroke="#4338CA" stroke-width="1"/>
    <text x="14" y="1" text-anchor="middle" class="sans" font-size="11.5" font-weight="800" fill="#A5B4FC">TS</text>
    <text x="38" y="1" class="sans" font-size="17" font-weight="800" fill="#FAFAFA" letter-spacing="-0.3">Engineering Architecture &amp; Tech Stack</text>
    <circle cx="352" cy="-4" r="3" fill="#818CF8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1104" y="0" text-anchor="end" class="sans" font-size="12.5" font-weight="600" fill="#71717A">Production Domains</text>
  </g>

  <!-- COL 1: Languages -->
  <g transform="translate(4, 54)">
    <rect x="0" y="0" width="265" height="232" rx="18" fill="url(#bgCard)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="232" rx="18" fill="none" stroke="url(#beamStack)" stroke-width="1.4" stroke-dasharray="140 860" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="26" cy="32" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="37" class="sans" font-size="15" font-weight="800" fill="#FAFAFA">Core Languages</text>
    <line x1="22" y1="54" x2="243" y2="54" stroke="#27272A" stroke-width="1"/>

    <g transform="translate(22, 72)">
      <rect x="0" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Python 3.12</text>

      <rect x="114" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">TypeScript</text>

      <rect x="0" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">C# / .NET</text>

      <rect x="114" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">JavaScript</text>

      <rect x="0" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">SQL / Postgres</text>

      <rect x="114" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Bash / Shell</text>

      <text x="0" y="138" class="sans" font-size="11.5" font-weight="600" fill="#38BDF8">Primary: Python &amp; TypeScript</text>
    </g>
  </g>

  <!-- COL 2: AI & ML -->
  <g transform="translate(286, 54)">
    <rect x="0" y="0" width="265" height="232" rx="18" fill="url(#bgCard)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="232" rx="18" fill="none" stroke="url(#beamStack)" stroke-width="1.4" stroke-dasharray="140 860" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="750" to="-250" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="26" cy="32" r="5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="37" class="sans" font-size="15" font-weight="800" fill="#FAFAFA">AI &amp; Deep Learning</text>
    <line x1="22" y1="54" x2="243" y2="54" stroke="#27272A" stroke-width="1"/>

    <g transform="translate(22, 72)">
      <rect x="0" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">PyTorch</text>

      <rect x="114" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Hugging Face</text>

      <rect x="0" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Unsloth QLoRA</text>

      <rect x="114" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">YOLOv8 / CV</text>

      <rect x="0" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">OpenCV</text>

      <rect x="114" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">vLLM / GGUF</text>

      <text x="0" y="138" class="sans" font-size="11.5" font-weight="600" fill="#34D399">Focus: Khmer NLP &amp; Vision</text>
    </g>
  </g>

  <!-- COL 3: Full-Stack & APIs -->
  <g transform="translate(568, 54)">
    <rect x="0" y="0" width="265" height="232" rx="18" fill="url(#bgCard)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="232" rx="18" fill="none" stroke="url(#beamStack)" stroke-width="1.4" stroke-dasharray="140 860" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="500" to="-500" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="26" cy="32" r="5" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="37" class="sans" font-size="15" font-weight="800" fill="#FAFAFA">Full-Stack &amp; Web</text>
    <line x1="22" y1="54" x2="243" y2="54" stroke="#27272A" stroke-width="1"/>

    <g transform="translate(22, 72)">
      <rect x="0" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">React 19</text>

      <rect x="114" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Next.js</text>

      <rect x="0" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">FastAPI</text>

      <rect x="114" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Node.js</text>

      <rect x="0" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Tailwind CSS</text>

      <rect x="114" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">REST / WebSocket</text>

      <text x="0" y="138" class="sans" font-size="11.5" font-weight="600" fill="#FBBF24">Low-Latency Inference APIs</text>
    </g>
  </g>

  <!-- COL 4: Cloud & MLOps -->
  <g transform="translate(850, 54)">
    <rect x="0" y="0" width="266" height="232" rx="18" fill="url(#bgCard)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="0" y="0" width="266" height="232" rx="18" fill="none" stroke="url(#beamStack)" stroke-width="1.4" stroke-dasharray="140 860" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="250" to="-750" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="26" cy="32" r="5" fill="#818CF8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="37" class="sans" font-size="15" font-weight="800" fill="#FAFAFA">Infrastructure &amp; Ops</text>
    <line x1="22" y1="54" x2="243" y2="54" stroke="#27272A" stroke-width="1"/>

    <g transform="translate(22, 72)">
      <rect x="0" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Docker</text>

      <rect x="114" y="0" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Linux / Ubuntu</text>

      <rect x="0" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">GitHub Actions</text>

      <rect x="114" y="40" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="59" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">PostgreSQL</text>

      <rect x="0" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="53" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">Redis Cache</text>

      <rect x="114" y="80" width="106" height="30" rx="8" fill="#18181F" stroke="#272732" stroke-width="1"/>
      <text x="167" y="99" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#E4E4E7">CUDA / GPU</text>

      <text x="0" y="138" class="sans" font-size="11.5" font-weight="600" fill="#A5B4FC">CI/CD &amp; Containerized Deploy</text>
    </g>
  </g>
</svg>